<div class="container mt-4" style="max-width: 420px">
  <h2>Admin Login</h2>

  <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email" autocomplete="username" />
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input
        type="password"
        class="form-control"
        formControlName="password"
        autocomplete="current-password"
      />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || submitting">
      {{ submitting ? 'Logging in...' : 'Log In' }}
    </button>
  </form>
</div>
