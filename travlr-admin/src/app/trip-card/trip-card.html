<div class="card h-100">
  <img
    [src]="trip.image ? '/images/' + trip.image : 'https://placehold.co/300x180?text=Travlr+Getaways'"
    class="card-img-top"
    [alt]="trip.name"
  />
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ trip.name }}</h5>
    <p class="card-text text-muted mb-1">Trip code: {{ trip.tripCode }}</p>
    <p class="card-text text-muted mb-1">{{ trip.length }} &middot; Starts {{ trip.startDate }}</p>
    <p class="card-text">{{ trip.resort }}</p>
    <p class="card-text fw-bold">{{ trip.perPerson }} per person</p>
    <a
      *ngIf="authService.isLoggedIn()"
      [routerLink]="['/edit-trip', trip.tripCode]"
      class="btn btn-outline-primary mt-auto"
      >Edit</a
    >
  </div>
</div>
