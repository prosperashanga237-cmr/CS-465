<div class="container mt-4">
  <h2>{{ isEditMode ? 'Edit Trip' : 'Add Trip' }}</h2>

  <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>

  <form [formGroup]="tripForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Trip Code</label>
      <input type="text" class="form-control" formControlName="tripCode" [readonly]="isEditMode" />
    </div>
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" formControlName="name" />
    </div>
    <div class="mb-3">
      <label class="form-label">Length</label>
      <input type="text" class="form-control" formControlName="length" placeholder="e.g. 10 days" />
    </div>
    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input type="text" class="form-control" formControlName="startDate" placeholder="e.g. 2026-11-15" />
    </div>
    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input type="text" class="form-control" formControlName="resort" />
    </div>
    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input type="text" class="form-control" formControlName="perPerson" placeholder="e.g. 1899" />
    </div>
    <div class="mb-3">
      <label class="form-label">Image filename</label>
      <input type="text" class="form-control" formControlName="image" placeholder="e.g. galapagos.jpg" />
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="4" formControlName="description"></textarea>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="tripForm.invalid">
      {{ isEditMode ? 'Save Changes' : 'Add Trip' }}
    </button>
    <button type="button" class="btn btn-danger ms-2" *ngIf="isEditMode" (click)="onDelete()">
      Delete Trip
    </button>
    <a routerLink="/" class="btn btn-secondary ms-2">Cancel</a>
  </form>
</div>
