<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Travlr Getaways &mdash; Trip Administration</h2>
    <a routerLink="/add-trip" class="btn btn-primary">Add Trip</a>
  </div>

  <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let trip of trips">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  </div>

  <p *ngIf="trips.length === 0 && !errorMessage">No trips found yet. Click &quot;Add Trip&quot; to create one.</p>
</div>
